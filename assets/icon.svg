<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#0e2238"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="briefcaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Cloud -->
  <g filter="url(#glow)">
    <path d="M165 370 H375 C413 370 445 338 445 300 C445 266 420 238 387 232 C383 175 336 130 277 130 C228 130 186 161 172 205 C164 202 155 200 145 200 C106 200 75 231 75 270 C75 308 106 340 145 340 H165 Z" fill="url(#cloudGrad)"/>
  </g>

  <!-- Growth Arrow -->
  <g stroke="#0a192f" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <path d="M260 270 L315 195 L355 240 L425 155" fill="none" stroke="url(#arrowGrad)" stroke-width="28"/>
    <!-- Arrow Head -->
    <path d="M380 145 L435 150 L430 205 Z" fill="url(#arrowGrad)" stroke="url(#arrowGrad)" stroke-width="4"/>
  </g>

  <!-- Briefcase -->
  <g>
    <!-- Handle -->
    <path d="M210 260 V235 C210 220 222 208 238 208 H274 C290 208 302 220 302 235 V260" fill="none" stroke="#0a192f" stroke-width="32" stroke-linecap="round"/>
    <path d="M210 260 V235 C210 220 222 208 238 208 H274 C290 208 302 220 302 235 V260" fill="none" stroke="url(#briefcaseGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- Briefcase Body -->
    <rect x="145" y="250" width="222" height="150" rx="28" fill="#0a192f"/>
    <rect x="153" y="258" width="206" height="134" rx="22" fill="url(#briefcaseGrad)"/>

    <!-- Briefcase Front Flap / Accent -->
    <path d="M153 285 C220 330 292 330 359 285" fill="none" stroke="#0a192f" stroke-width="12" stroke-linecap="round"/>
    <rect x="238" y="295" width="36" height="24" rx="6" fill="#0a192f"/>
    <rect x="244" y="300" width="24" height="14" rx="3" fill="#fcd34d"/>
  </g>
</svg>
